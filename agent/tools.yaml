# MCP Toolbox for Databases configuration for Urban Heat Emergency Planner
# 1. Historic Data Agent tools query EXCLUSIVELY:
#    - qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.station_daily_temps
#    - qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_observations
# 2. Operational Vulnerability & Tri-Agency Dispatch tools query BigQuery ML:
#    - qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model (evaluated over v_tract_heat_features)

sources:
  a4i-bigquery:
    kind: bigquery
    project: qwiklabs-gcp-04-f8ba79cf4618
    location: US

tools:
  get_station_7yr_annual_frequency:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Query 7-year annual weather station heat frequency and trends (2019–2025)
      using EXCLUSIVELY `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.station_daily_temps`.
    parameters:
      - name: threshold_f
        type: float
        description: Daily maximum temperature threshold in °F (e.g. 100.0).
    statement: |
      SELECT
        EXTRACT(YEAR FROM observation_date) AS year,
        COUNT(DISTINCT station_id) AS active_stations,
        COUNT(*) AS total_station_days,
        ROUND(AVG(max_temp_f), 2) AS avg_daily_max_f,
        ROUND(MAX(max_temp_f), 1) AS peak_max_temp_f,
        COUNTIF(max_temp_f >= @threshold_f) AS station_days_ge_threshold,
        ROUND(SAFE_DIVIDE(COUNTIF(max_temp_f >= @threshold_f), COUNT(DISTINCT station_id)), 1) AS avg_days_ge_threshold_per_station,
        ROUND(SAFE_DIVIDE(COUNTIF(max_temp_f >= 95.0), COUNT(DISTINCT station_id)), 1) AS avg_days_ge_95f_per_station,
        ROUND(SAFE_DIVIDE(COUNTIF(max_temp_f >= 100.0), COUNT(DISTINCT station_id)), 1) AS avg_days_ge_100f_per_station,
        ROUND(SAFE_DIVIDE(COUNTIF(max_temp_f >= 102.0), COUNT(DISTINCT station_id)), 1) AS avg_days_ge_102f_per_station,
        ROUND(SAFE_DIVIDE(COUNTIF(max_temp_f >= 105.0), COUNT(DISTINCT station_id)), 1) AS avg_days_ge_105f_per_station
      FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.station_daily_temps`
      GROUP BY year
      ORDER BY year ASC

  get_station_7yr_by_station:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Query 7-year per-station daily maximum temperature summary and threshold
      exceedance counts across all 16 regional weather stations using EXCLUSIVELY
      `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.station_daily_temps`.
    parameters:
      - name: threshold_f
        type: float
        description: Daily maximum temperature threshold in °F (e.g. 100.0).
    statement: |
      SELECT
        station_id,
        station_name,
        ROUND(AVG(latitude), 5) AS latitude,
        ROUND(AVG(longitude), 5) AS longitude,
        COUNT(*) AS total_days_recorded,
        CAST(MIN(observation_date) AS STRING) AS first_observation_date,
        CAST(MAX(observation_date) AS STRING) AS last_observation_date,
        ROUND(MIN(max_temp_f), 1) AS min_max_temp_f,
        ROUND(AVG(max_temp_f), 2) AS avg_daily_max_f,
        ROUND(MAX(max_temp_f), 1) AS peak_max_temp_f,
        COUNTIF(max_temp_f >= @threshold_f) AS total_days_ge_threshold,
        ROUND(SAFE_DIVIDE(COUNTIF(max_temp_f >= @threshold_f), COUNT(*) / 365.25), 1) AS annualized_days_ge_threshold_per_year,
        COUNTIF(max_temp_f >= 95.0) AS total_days_ge_95f,
        COUNTIF(max_temp_f >= 100.0) AS total_days_ge_100f,
        COUNTIF(max_temp_f >= 102.0) AS total_days_ge_102f,
        COUNTIF(max_temp_f >= 105.0) AS total_days_ge_105f
      FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.station_daily_temps`
      GROUP BY station_id, station_name
      ORDER BY total_days_ge_threshold DESC, peak_max_temp_f DESC

  get_heat_observations_campaign_summary:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Summarize the Dallas street-level Heat Watch traverse campaign (19,491 points)
      using EXCLUSIVELY `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_observations`.
    parameters:
      - name: threshold_f
        type: float
        description: Street-level temperature threshold in °F (e.g. 105.0).
    statement: |
      WITH city_baseline AS (
        SELECT AVG(temp_f) AS city_mean_temp_f
        FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_observations`
      )
      SELECT
        ANY_VALUE(h.city) AS city,
        COUNT(*) AS total_readings,
        ROUND(MIN(h.latitude), 5) AS min_latitude,
        ROUND(MAX(h.latitude), 5) AS max_latitude,
        ROUND(MIN(h.longitude), 5) AS min_longitude,
        ROUND(MAX(h.longitude), 5) AS max_longitude,
        ROUND(MIN(h.temp_f), 2) AS min_temp_f,
        ROUND(AVG(h.temp_f), 2) AS mean_temp_f,
        ROUND(MAX(h.temp_f), 2) AS max_temp_f,
        ROUND(MIN(h.temp_f - c.city_mean_temp_f), 2) AS min_heat_offset_vs_city_mean_f,
        ROUND(MAX(h.temp_f - c.city_mean_temp_f), 2) AS max_heat_offset_vs_city_mean_f,
        COUNTIF(h.temp_f >= @threshold_f) AS readings_at_or_above_threshold,
        COUNTIF(h.temp_f >= 105.0) AS readings_ge_105f,
        COUNTIF(h.temp_f >= 107.0) AS readings_ge_107f,
        COUNTIF(h.temp_f >= 108.0) AS readings_ge_108f,
        COUNTIF(h.observed_at IS NOT NULL) AS non_null_observed_at_count,
        COUNTIF(h.heat_index_f IS NOT NULL) AS non_null_heat_index_f_count,
        COUNTIF(h.humidity_pct IS NOT NULL) AS non_null_humidity_pct_count
      FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_observations` h
      CROSS JOIN city_baseline c

  explain_predict_point_heat_risk:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Run BigQuery ML `ML.EXPLAIN_PREDICT` on `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`
      for the census tract nearest to a requested (latitude, longitude) coordinate in
      `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.v_tract_heat_features`,
      returning `predicted_heat_offset_f` and `top_feature_attributions`
      alongside the tract's UVI score and resilience attributes.
    parameters:
      - name: lat
        type: float
        description: WGS84 latitude in decimal degrees (e.g. 32.755).
      - name: lon
        type: float
        description: WGS84 longitude in decimal degrees (e.g. -96.808).
    statement: |
      WITH nearest_tract AS (
        SELECT
          u.*,
          ST_DISTANCE(
            ST_GEOGPOINT(@lon, @lat),
            ST_GEOGPOINT(u.tract_lon, u.tract_lat)
          ) / 1000.0 AS distance_to_tract_km
        FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.v_tract_heat_features` u
        WHERE u.median_age > 0
          AND u.universal_vulnerability_index >= 0
          AND u.building_age_years BETWEEN 0 AND 250
          AND u.surrounding_3km_bldg_age BETWEEN 0 AND 250
        ORDER BY distance_to_tract_km ASC
        LIMIT 1
      )
      SELECT *
      FROM ML.EXPLAIN_PREDICT(
        MODEL `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`,
        TABLE nearest_tract,
        STRUCT(5 AS top_k_features)
      )

  get_top_emergency_tracts:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Fetch the top N highest-priority census tracts in Dallas using BigQuery ML
      `ML.EXPLAIN_PREDICT` on `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`
      (over `v_tract_heat_features`), returning `predicted_heat_offset_f`,
      `top_feature_attributions`, and all 4 metric groups: Geographic Identifiers,
      Climate & Temperature Metrics, Demographics & Mobility, and Urban Environment
      & Resilience Infrastructure.
    parameters:
      - name: limit_n
        type: integer
        description: Number of top tracts to return (e.g. 10).
    statement: |
      WITH top_tracts AS (
        SELECT *
        FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.v_tract_heat_features`
        WHERE median_age > 0
          AND universal_vulnerability_index >= 0
          AND building_age_years BETWEEN 0 AND 250
          AND surrounding_3km_bldg_age BETWEEN 0 AND 250
        ORDER BY universal_vulnerability_index DESC, no_cars DESC
        LIMIT @limit_n
      )
      SELECT *
      FROM ML.EXPLAIN_PREDICT(
        MODEL `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`,
        TABLE top_tracts,
        STRUCT(5 AS top_k_features)
      )
      ORDER BY universal_vulnerability_index DESC, no_cars DESC

  get_tract_by_geoid:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Look up a specific census tract by 11-digit GEOID and evaluate it with
      `ML.EXPLAIN_PREDICT` on `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`.
    parameters:
      - name: tract_geoid
        type: string
        description: 11-digit Census Tract GEOID (e.g. '48113020500').
    statement: |
      SELECT *
      FROM ML.EXPLAIN_PREDICT(
        MODEL `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`,
        (
          SELECT *
          FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.v_tract_heat_features`
          WHERE LPAD(CAST(geo_id AS STRING), 11, '0') = LPAD(@tract_geoid, 11, '0')
        ),
        STRUCT(5 AS top_k_features)
      )

  get_city_uvi_summary:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Summarize city-wide climate, demographic, and infrastructure resilience
      metrics from `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`
      (`ML.EXPLAIN_PREDICT` over `v_tract_heat_features`).
    statement: |
      SELECT
        'Dallas' AS city,
        COUNT(*) AS total_valid_tracts,
        COUNTIF(is_measured = 1) AS measured_heat_watch_tracts,
        COUNTIF(is_measured = 0) AS bqml_predicted_unmeasured_tracts,
        ROUND(AVG(universal_vulnerability_index), 2) AS avg_uvi,
        ROUND(MAX(universal_vulnerability_index), 2) AS max_uvi,
        ROUND(MIN(predicted_heat_offset_f), 2) AS min_predicted_offset_f,
        ROUND(AVG(predicted_heat_offset_f), 2) AS avg_predicted_offset_f,
        ROUND(MAX(predicted_heat_offset_f), 2) AS max_predicted_offset_f,
        COUNTIF(heat_wave_risk_flag = 'Highly Likely') AS highly_likely_heatwave_tracts,
        COUNTIF(greenery_status = 'Urban Heat Island - Higher Risk') AS uhi_higher_risk_tracts,
        COUNTIF(urban_density_status = 'Moderate Density') AS moderate_density_tracts,
        COUNTIF(capacity_status = 'Over Capacity') AS over_capacity_cooling_tracts,
        CAST(SUM(no_cars) AS INT64) AS total_no_car_households,
        CAST(SUM(households) AS INT64) AS total_households,
        ROUND(SAFE_DIVIDE(SUM(no_cars), NULLIF(SUM(households), 0)) * 100.0, 1) AS city_no_vehicle_rate_pct,
        ROUND(AVG(median_age), 1) AS city_avg_age
      FROM ML.EXPLAIN_PREDICT(
        MODEL `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`,
        (
          SELECT *
          FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.v_tract_heat_features`
          WHERE median_age > 0
            AND universal_vulnerability_index >= 0
            AND building_age_years BETWEEN 0 AND 250
            AND surrounding_3km_bldg_age BETWEEN 0 AND 250
        ),
        STRUCT(5 AS top_k_features)
      )

  get_equity_audit_cohorts:
    kind: bigquery-sql
    source: a4i-bigquery
    description: >-
      Compare Top 10 Universal Vulnerability Index tracts, Top 10 Pure Heat-Offset
      tracts, and the City-Wide Dallas Baseline using BigQuery ML `ML.EXPLAIN_PREDICT`
      on `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`.
    statement: |
      WITH clean AS (
        SELECT
          LPAD(CAST(geo_id AS STRING), 11, '0') AS geo_id,
          universal_vulnerability_index,
          COALESCE(avg_temp_f, 105.32 + predicted_heat_offset_f) AS observed_avg_temp,
          predicted_heat_offset_f,
          median_age AS average_age,
          no_cars,
          households,
          SAFE_DIVIDE(no_cars, NULLIF(households, 0)) AS no_vehicle_rate,
          ROW_NUMBER() OVER (ORDER BY universal_vulnerability_index DESC, no_cars DESC) AS uvi_rank,
          ROW_NUMBER() OVER (ORDER BY predicted_heat_offset_f DESC) AS temp_rank
        FROM ML.EXPLAIN_PREDICT(
          MODEL `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.heat_offset_model`,
          (
            SELECT *
            FROM `qwiklabs-gcp-04-f8ba79cf4618.a4i_climate.v_tract_heat_features`
            WHERE median_age > 0
              AND universal_vulnerability_index >= 0
              AND building_age_years BETWEEN 0 AND 250
              AND surrounding_3km_bldg_age BETWEEN 0 AND 250
          ),
          STRUCT(5 AS top_k_features)
        )
      )
      SELECT
        '1_top_10_uvi_priority' AS cohort,
        COUNT(*) AS num_tracts,
        ROUND(AVG(universal_vulnerability_index), 2) AS avg_uvi,
        ROUND(AVG(observed_avg_temp), 2) AS avg_observed_temp_f,
        ROUND(AVG(predicted_heat_offset_f), 2) AS avg_predicted_offset_f,
        ROUND(AVG(no_vehicle_rate) * 100.0, 2) AS avg_no_vehicle_rate_pct,
        CAST(SUM(no_cars) AS INT64) AS total_no_car_households,
        ROUND(AVG(average_age), 1) AS avg_age
      FROM clean
      WHERE uvi_rank <= 10
      UNION ALL
      SELECT
        '2_top_10_pure_temperature' AS cohort,
        COUNT(*) AS num_tracts,
        ROUND(AVG(universal_vulnerability_index), 2) AS avg_uvi,
        ROUND(AVG(observed_avg_temp), 2) AS avg_observed_temp_f,
        ROUND(AVG(predicted_heat_offset_f), 2) AS avg_predicted_offset_f,
        ROUND(AVG(no_vehicle_rate) * 100.0, 2) AS avg_no_vehicle_rate_pct,
        CAST(SUM(no_cars) AS INT64) AS total_no_car_households,
        ROUND(AVG(average_age), 1) AS avg_age
      FROM clean
      WHERE temp_rank <= 10
      UNION ALL
      SELECT
        '3_citywide_dallas_baseline' AS cohort,
        COUNT(*) AS num_tracts,
        ROUND(AVG(universal_vulnerability_index), 2) AS avg_uvi,
        ROUND(AVG(observed_avg_temp), 2) AS avg_observed_temp_f,
        ROUND(AVG(predicted_heat_offset_f), 2) AS avg_predicted_offset_f,
        ROUND(AVG(no_vehicle_rate) * 100.0, 2) AS avg_no_vehicle_rate_pct,
        CAST(SUM(no_cars) AS INT64) AS total_no_car_households,
        ROUND(AVG(average_age), 1) AS avg_age
      FROM clean
      ORDER BY cohort
